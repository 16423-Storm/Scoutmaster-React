name: Deploy React Website

on:
    push:
        branches:
            - main
        paths:
            - "Scoutmaster/**"
            - ".github/workflows/deploy-website.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    build-and-deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: Scoutmaster

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: Scoutmaster/package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Create .env file
              run: |
                  echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
                  echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
                  echo "VITE_PYTHON_SERVER_URL=${{ secrets.VITE_PYTHON_SERVER_URL }}" >> .env

            - name: Build React website
              run: npm run build

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload website
              uses: actions/upload-pages-artifact@v4
              with:
                  path: Scoutmaster/dist

            - name: Deploy website
              id: deployment
              uses: actions/deploy-pages@v4
