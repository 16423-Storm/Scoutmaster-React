name: Issue Label Management
on:
  issues:
    types: [opened, assigned]

permissions:
  issues: write

jobs:
  update-claim-label:
    runs-on: ubuntu-latest
    steps:
      - name: Manage claimed / not claimed labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const action = context.payload.action;
            const assigneesCount = context.payload.issue.assignees.length;
            const currentLabels = context.payload.issue.labels.map(l => l.name);

            // Exit early if someone was already assigned before this event
            if (action === 'assigned' && assigneesCount > 1) {
              return;
            }

            if (action === 'assigned' || (action === 'opened' && assigneesCount > 0)) {
              if (currentLabels.includes('not claimed 🙁')) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: 'not claimed 🙁'
                });
              }
              if (!currentLabels.includes('claimed')) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: ['claimed 😁']
                });
              }
            } else if (action === 'opened' && assigneesCount === 0) {
              if (!currentLabels.includes('not claimed')) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: ['not claimed']
                });
              }
            }
