<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Scoutmaster</title>
        <script>
            var l = window.location;
            if (!l.hash || !l.hash.startsWith("#/")) {
                var pathname = l.pathname.replace(/^\//, "");
                var newUrl =
                    l.protocol +
                    "//" +
                    l.hostname +
                    (l.port ? ":" + l.port : "") +
                    "/#/" +
                    pathname +
                    l.search +
                    l.hash;
                l.replace(newUrl);
            }
        </script>
    </head>
    <body></body>
</html>
